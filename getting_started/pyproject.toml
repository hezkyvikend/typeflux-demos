[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typeflux-getting-started"
version = "0.1.0"
description = "Notebook-first Typeflux getting started walkthrough."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typeflux-py[openai]>=0.1.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.0",
  "nbformat>=5.10",
]

[tool.setuptools]
packages = []
