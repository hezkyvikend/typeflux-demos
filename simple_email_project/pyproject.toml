[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typeflux-simple-email-project"
version = "0.1.0"
description = "A simple YAML Typeflux project that classifies email intent and drafts a reply."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typeflux-py[openai]>=0.1.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
simple-email = "simple_email_project.main:main"

[tool.setuptools]
packages = [
  "simple_email_project",
  "simple_email_project.config",
  "simple_email_project.demo",
  "simple_email_project.prompts",
  "simple_email_project.schemas",
  "simple_email_project.steps",
  "simple_email_project.workflows",
]

[tool.setuptools.package-dir]
simple_email_project = "."
"simple_email_project.config" = "config"
"simple_email_project.demo" = "demo"
"simple_email_project.prompts" = "prompts"
"simple_email_project.schemas" = "schemas"
"simple_email_project.steps" = "steps"
"simple_email_project.workflows" = "workflows"

[tool.setuptools.package-data]
"simple_email_project.prompts" = ["*.txt"]
"simple_email_project.workflows" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
